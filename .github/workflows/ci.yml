name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + types + tests + evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Catalogue is valid and reproducible
        run: python -m tools.catalogue_gen.validate
      - name: Tests with coverage (no network, no secrets)
        run: python -m pytest -m "not slow" --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Evaluation gates (whole eval sets replayed; slow under coverage, so run without it)
        run: python -m pytest -m slow
      - name: Concierge evaluation and guardrail (replays recorded LLM replies)
        run: python -m evals.run --out /tmp/results.md
      - name: Red-team evaluation (hostile messages; fails if a stated constraint is ever dropped)
        run: python -m evals.redteam --out /tmp/redteam.md
      - name: Model bake-off report (replay)
        run: python -m evals.bakeoff --out /tmp/bakeoff.md
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-and-coverage-reports
          path: |
            /tmp/results.md
            /tmp/redteam.md
            /tmp/bakeoff.md
            coverage.xml

  docker:
    name: docker image builds, is scanned and passes its health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t foodbot:ci --build-arg GIT_SHA=${{ github.sha }} .
      - name: Image runs as non-root and has no secrets baked in
        run: |
          test "$(docker run --rm --entrypoint id foodbot:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh foodbot:ci -c 'ls -a /app | grep -x .env'
      - name: The image can load its catalogue and import the app
        run: |
          docker run --rm --entrypoint python foodbot:ci -c \
            "import foodbot.app; from foodbot.services.catalogue import load; r, i = load(); print(r, i); assert r > 400 and i > 10000"
      - name: Fails fast with a clear message when the bot token is missing
        run: |
          set +e
          out=$(docker run --rm foodbot:ci 2>&1); code=$?
          echo "$out" | tail -5
          test $code -ne 0 && echo "$out" | grep -q "TELEGRAM_BOT_TOKEN"
      - name: Vulnerability scan (Trivy; fails on fixable HIGH or CRITICAL findings)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress foodbot:ci

  publish:
    name: publish the image to GHCR (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$image:${{ github.sha }}" -t "$image:latest" --build-arg GIT_SHA=${{ github.sha }} .
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
