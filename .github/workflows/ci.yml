name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + tests + evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Catalogue is valid and reproducible
        run: python -m tools.catalogue_gen.validate
      - name: Tests (no network, no secrets)
        run: python -m pytest
      - name: Concierge evaluation and guardrail (replays recorded LLM replies)
        run: python -m evals.run --out /tmp/results.md
      - name: Red-team evaluation (hostile messages; fails if a stated constraint is ever dropped)
        run: python -m evals.redteam --out /tmp/redteam.md
      - name: Keep the eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            /tmp/results.md
            /tmp/redteam.md

  docker:
    name: docker image builds and passes its health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t foodbot:ci --build-arg GIT_SHA=${{ github.sha }} .
      - name: Image runs as non-root and has no secrets baked in
        run: |
          test "$(docker run --rm --entrypoint id foodbot:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh foodbot:ci -c 'ls -a /app | grep -x .env'
      - name: The image can load its catalogue and import the app
        run: |
          docker run --rm --entrypoint python foodbot:ci -c \
            "import foodbot.app; from foodbot.services.catalogue import load; r, i = load(); print(r, i); assert r > 400 and i > 10000"
      - name: Fails fast with a clear message when the bot token is missing
        run: |
          set +e
          out=$(docker run --rm foodbot:ci 2>&1); code=$?
          echo "$out" | tail -5
          test $code -ne 0 && echo "$out" | grep -q "TELEGRAM_BOT_TOKEN"
