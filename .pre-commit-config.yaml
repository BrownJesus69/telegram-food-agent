repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=4000]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(csv|jsonl|md)$
  - repo: local
    hooks:
      - id: no-secrets-in-env-files
        name: refuse to commit .env
        entry: python -c "import sys; sys.exit('refusing to commit a .env file')"
        language: system
        files: '(^|/)\.env$'
